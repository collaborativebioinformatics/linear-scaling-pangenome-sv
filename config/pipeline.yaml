# Pipeline configuration for parallel pangenome graph construction
# The smoke test runs a ~1 Mb chr21 interval to validate the full pipeline.

project:
  name: parallel-pangenome
  version: 0.1.0

target:
  reference: GRCh38
  chromosome: chr21
  mode: smoke
  start: 20000000
  end: 21000000             # ~1 Mb smoke-test interval

parallel:
  chunk_size_bp: 400000     # 400 Kb — produces 2-3 chunks for 1 Mb region
  overlap_bp: 50000         # 50 Kb overlap for boundary reconciliation
  max_local_workers: 4

pggb:
  threads: 16
  minimum_identity: 90
  segment_length: 5000

merge:
  strategy: overlap_aware
  fail_on_unresolved_boundary: false

output:
  results_dir: results
  work_dir: work

logging:
  level: INFO
  log_dir: results/logs
