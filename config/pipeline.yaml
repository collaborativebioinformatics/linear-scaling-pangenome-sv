# Pipeline configuration for parallel pangenome graph construction
# The smoke test runs a ~1 Mb chr21 interval to validate the full pipeline.
#
# COORDINATE SEMANTICS:
# All genomic coordinates (start, end) use 0-based half-open intervals
# matching Python slicing semantics (seq[start:end]).
#   - start=20000000, end=21000000 means bases 20,000,000 through 20,999,999
#   - Length = end - start = 1,000,000 bp

project:
  name: parallel-pangenome
  version: 0.1.0

target:
  reference: GRCh38
  chromosome: chr21
  mode: smoke
  start: 20000000
  end: 21000000             # ~1 Mb smoke-test interval (0-based half-open)

mapping:
  min_mapq: 20
  min_query_coverage: 0.90  # Require >= 90% of query interval to be mapped

parallel:
  chunk_size_bp: 400000     # 400 Kb — produces 2-3 chunks for 1 Mb region
  overlap_bp: 50000         # 50 Kb overlap for boundary reconciliation
  max_local_workers: 4

# PGGB algorithm parameters — SINGLE SOURCE OF TRUTH for both baseline and chunks.
# Any change here is reflected everywhere. Do NOT hardcode pggb flags in shell scripts.
pggb:
  threads: 8               # Default threads for PGGB (use config or nproc)
  params:
    minimum_identity: 90   # -p: minimum identity for alignment
    segment_length: 5000   # -s: segment length for homopolymer compression
    kmer_length: 29        # -k: k-mer length for sparse minimizer sketch
    window_size: 50000     # -w: window length for pangenome graph
    map_pct_id: 0          # -j: mapping alignment identity filter (0 = none)
    # For canonical PGGB command:
    # pggb -i input.fa -o output -t THREADS -n NUM_PATHS -p 90 -s 5000 -k 29 -w 50000 -j 0 -e 0
    noise_filter: 0        # -e: noise filter ratio

  # Immutable image reference — NEVER use :latest for scientific benchmarks.
  # Pinned to a specific digest for reproducibility.
  image: ghcr.io/pangenome/pggb@sha256:2e89b1d1e4f48b33e5af8c4bd677e8145f953d80cbedc86e8b525ce5a27a6c38
  image_tag: v0.6.0
  # ^ Use explicit tag for readability, digest for reproducibility.
  # The tagged image should resolve to the digest above; if they diverge,
  # the digest takes precedence.

merge:
  strategy: overlap_aware
  fail_on_unresolved_boundary: false

output:
  results_dir: results
  work_dir: work

logging:
  level: INFO
  log_dir: results/logs
