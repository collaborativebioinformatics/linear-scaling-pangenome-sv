# Pipeline configuration for parallel pangenome graph construction
# The smoke test runs a ~1 Mb chr21 interval to validate the full pipeline.
#
# COORDINATE SEMANTICS:
# All genomic coordinates (start, end) use 0-based half-open intervals
# matching Python slicing semantics (seq[start:end]).
#   - start=20000000, end=21000000 means bases 20,000,000 through 20,999,999
#   - Length = end - start = 1,000,000 bp

project:
  name: parallel-pangenome
  version: 0.1.0

target:
  reference: GRCh38
  chromosome: chr21
  mode: smoke
  start: 20000000
  end: 21000000             # ~1 Mb smoke-test interval (0-based half-open)

mapping:
  min_mapq: 20
  min_query_coverage: 0.90  # Require >= 90% of query interval to be mapped

parallel:
  chunk_size_bp: 400000     # 400 Kb — produces 2-3 chunks for 1 Mb region
  overlap_bp: 50000         # 50 Kb overlap for boundary reconciliation
  max_local_workers: 4

# PGGB algorithm parameters — SINGLE SOURCE OF TRUTH for both baseline and chunks.
# Any change here is reflected everywhere. Do NOT hardcode pggb flags in shell scripts.
# These flags correspond to PGGB v0.6.0 CLI (verified against pinned digest).
# Reference: https://github.com/pangenome/pggb/blob/master/docs/rst/essential_parameters.rst
pggb:
  threads: 8               # Default threads for PGGB (use config or nproc)
  params:
    # -p: minimum identity for mapping (%) — graph-shaping parameter
    minimum_identity: 90
    # -s: segment length for homopolymer compression — graph-shaping parameter
    segment_length: 5000
    # -K: k-mer size for Mash sketch (minimizer) — controls sensitivity
    mash_kmer: 19
    # -k: minimum exact-match length for seqwish match — affects graph complexity
    match_length: 29
    # -j: smoothxg maximum path jump — gaps allowed when building layout
    path_jump_max: 0
    # -e: smoothxg maximum edge jump — gaps allowed in edges
    edge_jump_max: 0
    # Canonical PGGB v0.6.0 command:
    # pggb -i input.fa -o output -t THREADS -n NUM_PATHS -p 90 -s 5000 -K 31 -k 29 -j 0 -e 0
    # NOTE: -w is NOT a valid option in PGGB v0.6.0.
    # NOTE: -K (mash k-mer) and -k (seqwish match) are distinct parameters.

  # Immutable image reference — NEVER use :latest for scientific benchmarks.
  # Digest pulled successfully on DNAnexus Group11_2026 (chunk PGGB 2026-08-28).
  # The previous sha256:2e89b1d1… is unpublished (docker: manifest unknown).
  image: ghcr.io/pangenome/pggb@sha256:44f3563c5c3e2032c293fe309eed178b754021b07963ca4857e4ae5efda86474
  image_tag: v0.6.0

merge:
  strategy: overlap_aware
  fail_on_unresolved_boundary: false

output:
  results_dir: results
  work_dir: work

logging:
  level: INFO
  log_dir: results/logs
